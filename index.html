<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DKJ Knowledge Jackpot</title>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
    .card { background: white; padding: 20px; margin: 15px auto; max-width: 400px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    input { width: 80%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; }
    button { background-color: #28a745; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    button.watch-btn { background-color: #ff0000; display: block; width: 100%; margin-bottom: 10px; }
    button.share-btn { background-color: #0088cc; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h2>DKJ Knowledge Jackpot</h2>

  <!-- 1. SIGNUP / LOGIN SECTION -->
  <div id="auth-section" class="card">
    <h3>Register / Login</h3>
    <input type="text" id="username" placeholder="Apna Naam Likhein"><br>
    <input type="text" id="referCodeInput" placeholder="Referral Code (Optional)"><br>
    <button onclick="registerOrLogin()">Start / Sign In</button>
  </div>

  <!-- 2. USER DASHBOARD SECTION -->
  <div id="dashboard-section" class="card hidden">
    <h3>Welcome, <span id="user-display-name">User</span>!</h3>
    <p style="font-size: 20px; font-weight: bold; color: #28a745;">
      Balance: ₹<span id="user-balance">0</span>
    </p>

    <hr>

    <!-- Refer Section -->
    <h4>Refer & Earn ₹10</h4>
    <p>Apna Refer Code: <strong id="my-refer-code" style="color: #0088cc;">-</strong></p>
    <button class="share-btn" onclick="shareReferralLink()">Refer Code Copy Karein</button>

    <hr>

    <!-- Watch Video Section (5 Demo Videos) -->
    <h4>Watch & Earn (Demo Videos)</h4>
    <p style="font-size: 13px; color: #666;">
      Note: Video ko YouTube App mein LIKE aur Channel ko SUBSCRIBE zaroor karein!
    </p>

    <!-- Yahan aap baad mein apni asli 5 videos ki IDs replace kar sakte hain -->
    <button class="watch-btn" onclick="openYouTubeVideo('HZXhp5GoXig')">▶ Watch Demo Video 1</button>
    <button class="watch-btn" onclick="openYouTubeVideo('3JZ_D3ELwOQ')">▶ Watch Demo Video 2</button>
    <button class="watch-btn" onclick="openYouTubeVideo('9bZkp7q19f0')">▶ Watch Demo Video 3</button>
    <button class="watch-btn" onclick="openYouTubeVideo('JGwWNGJdvx8')">▶ Watch Demo Video 4</button>
    <button class="watch-btn" onclick="openYouTubeVideo('kJQP7kiw5Fk')">▶ Watch Demo Video 5</button>
  </div>

  <script>
    // -------------------------------------------------------------
    // Firebase Configuration (Aapki Real Keys Set Hain)
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyDxRxlv21GBhqvSLqctiQpJNzkbSCZ_ek",
      authDomain: "dkj-knowledge-jackpot.firebaseapp.com",
      databaseURL: "https://dkj-knowledge-jackpot-default-rtdb.firebaseio.com",
      projectId: "dkj-knowledge-jackpot",
      storageBucket: "dkj-knowledge-jackpot.appspot.com",
      messagingSenderId: "485996198291",
      appId: "1:485996198291:web:8319302c597aa5c34e1066",
      measurementId: "G-TXSBGKZKC"
    };

    // Firebase Initialize
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let currentUser = null;

    // -------------------------------------------------------------
    // User Registration & Refer Logic
    // -------------------------------------------------------------
    function registerOrLogin() {
      const name = document.getElementById('username').value.trim();
      const enteredReferCode = document.getElementById('referCodeInput').value.trim();

      if (!name) {
        alert("Kripya apna naam bharein!");
        return;
      }

      const isDeviceRegistered = localStorage.getItem("app_device_registered");
      const userId = "USER_" + name.replace(/\s+/g, '').toLowerCase() + "_" + Math.floor(1000 + Math.random() * 9000);
      const userRef = db.ref('users/' + userId);

      userRef.get().then((snapshot) => {
        if (!snapshot.exists()) {
          userRef.set({
            name: name,
            balance: 0,
            referCode: userId,
            createdAt: Date.now()
          }).then(() => {
            if (enteredReferCode !== "" && !isDeviceRegistered) {
              creditReferralBonus(enteredReferCode);
            } else if (isDeviceRegistered && enteredReferCode !== "") {
              alert("Is device par pehle se account bana hua hai, isliye Refer Bonus credit nahi hua.");
            }

            localStorage.setItem("app_device_registered", "true");
            localStorage.setItem("saved_user_id", userId);
            loadDashboard(userId);
          });
        } else {
          localStorage.setItem("saved_user_id", userId);
          loadDashboard(userId);
        }
      }).catch((error) => {
        alert("Error: " + error.message);
      });
    }

    // -------------------------------------------------------------
    // Purane Referrer Ko ₹10 Bonus Dene Ka Function
    // -------------------------------------------------------------
    creditReferralBonus = function(referrerCode) {
      const referrerBalanceRef = db.ref('users/' + referrerCode + '/balance');
      referrerBalanceRef.transaction((currentBalance) => {
        return (currentBalance || 0) + 10;
      }, (error, committed) => {
        if (committed) {
          alert("Referral Code Applied Successfully! Referrer ko ₹10 bonus mil gaya.");
        }
      });
    }

    // -------------------------------------------------------------
    // Dashboard & Live Balance Update
    // -------------------------------------------------------------
    function loadDashboard(userId) {
      db.ref('users/' + userId).on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          currentUser = data;
          document.getElementById('user-display-name').innerText = data.name;
          document.getElementById('user-balance').innerText = data.balance || 0;
          document.getElementById('my-refer-code').innerText = data.referCode;

          document.getElementById('auth-section').classList.add('hidden');
          document.getElementById('dashboard-section').classList.remove('hidden');
        }
      });
    }

    // -------------------------------------------------------------
    // Refer Code Copy Function
    // -------------------------------------------------------------
    function shareReferralLink() {
      if (!currentUser) return;
      const referCode = currentUser.referCode;
      const shareText = `Mera Refer Code: ${referCode} \nDKJ Knowledge Jackpot App Download karein aur mera Refer Code dalkar signup karein!`;

      navigator.clipboard.writeText(shareText).then(() => {
        alert("Refer Code aur Message copy ho gaya hai!");
      }).catch(() => {
        alert("Code: " + referCode);
      });
    }

    // -------------------------------------------------------------
    // Native YouTube Intent (Direct App Opening)
    // -------------------------------------------------------------
    function openYouTubeVideo(videoId) {
      const intentUrl = `intent://www.youtube.com/watch?v=${videoId}#Intent;package=com.google.android.youtube;scheme=https;end;`;
      window.location.href = intentUrl;
    }

    // Auto Login Check On Page Load
    window.onload = function() {
      const savedUserId = localStorage.getItem("saved_user_id");
      if (savedUserId) {
        loadDashboard(savedUserId);
      }
    };
  </script>
</body>
</html>
